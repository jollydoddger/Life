<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Scots Pine Bark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;color:#ccc;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:220px;background:rgba(0,0,0,0.88);padding:10px;
  max-height:100vh;overflow-y:auto;font-size:11px;z-index:10}
#ui h2{font-size:13px;color:#fff;margin-bottom:8px}
.g{margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:6px}
.gt{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.r{display:flex;align-items:center;margin-bottom:2px}
.r label{flex:1;font-size:10px}
.r input{width:80px;margin:0 4px}
.r .v{width:32px;text-align:right;font-size:10px;color:#aaa}
#info{position:absolute;bottom:6px;left:6px;font-size:10px;color:#555}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;font-size:16px}
</style>
</head>
<body>
<div id="loading">Generating bark...</div>
<canvas id="c"></canvas>
<div id="ui">
  <h2>Pine Bark Preview</h2>
  <div class="g"><div class="gt">Macro Plates</div>
    <div class="r"><label>Plate Scale</label><input type="range" id="ps" min="0.2" max="3" step="0.05" value="0.8"><span class="v" id="psV">0.8</span></div>
    <div class="r"><label>Y Stretch</label><input type="range" id="ys" min="2" max="20" step="0.5" value="8"><span class="v" id="ysV">8</span></div>
    <div class="r"><label>Levels</label><input type="range" id="nl" min="2" max="5" step="1" value="3"><span class="v" id="nlV">3</span></div>
    <div class="r"><label>Layer Depth</label><input type="range" id="ld" min="0.1" max="3" step="0.05" value="1.0"><span class="v" id="ldV">1.0</span></div>
    <div class="r"><label>Wall Steep</label><input type="range" id="ws" min="0.02" max="0.2" step="0.005" value="0.07"><span class="v" id="wsV">0.07</span></div>
    <div class="r"><label>Edge Fray</label><input type="range" id="ef" min="0" max="0.3" step="0.005" value="0.06"><span class="v" id="efV">0.06</span></div>
  </div>
  <div class="g"><div class="gt">Warp</div>
    <div class="r"><label>Warp X</label><input type="range" id="wx" min="0" max="4" step="0.1" value="1.2"><span class="v" id="wxV">1.2</span></div>
    <div class="r"><label>Warp Y</label><input type="range" id="wy" min="0" max="2" step="0.05" value="0.15"><span class="v" id="wyV">0.15</span></div>
  </div>
  <div class="g"><div class="gt">Sub-Plates</div>
    <div class="r"><label>Sub Scale</label><input type="range" id="ss" min="1" max="5" step="0.1" value="2.5"><span class="v" id="ssV">2.5</span></div>
    <div class="r"><label>Sub Depth</label><input type="range" id="sd" min="0" max="0.5" step="0.01" value="0.15"><span class="v" id="sdV">0.15</span></div>
  </div>
  <div class="g"><div class="gt">H-Breaks</div>
    <div class="r"><label>Freq</label><input type="range" id="hf" min="0.5" max="10" step="0.25" value="3"><span class="v" id="hfV">3</span></div>
    <div class="r"><label>Depth</label><input type="range" id="hd" min="0" max="1" step="0.02" value="0.25"><span class="v" id="hdV">0.25</span></div>
  </div>
  <div class="g"><div class="gt">Detail</div>
    <div class="r"><label>Crumple</label><input type="range" id="cr" min="0" max="0.5" step="0.01" value="0.12"><span class="v" id="crV">0.12</span></div>
    <div class="r"><label>Plate Var</label><input type="range" id="pv" min="0" max="1" step="0.05" value="0.8"><span class="v" id="pvV">0.8</span></div>
    <div class="r"><label>Tilt</label><input type="range" id="pt" min="0" max="0.3" step="0.01" value="0.08"><span class="v" id="ptV">0.08</span></div>
    <div class="r"><label>Fibre</label><input type="range" id="fg" min="0" max="0.15" step="0.005" value="0.03"><span class="v" id="fgV">0.03</span></div>
    <div class="r"><label>Micro</label><input type="range" id="mr" min="0" max="0.1" step="0.005" value="0.02"><span class="v" id="mrV">0.02</span></div>
  </div>
  <div class="g"><div class="gt">Master</div>
    <div class="r"><label>Depth (mm)</label><input type="range" id="od" min="0.5" max="8" step="0.1" value="3"><span class="v" id="odV">3</span></div>
    <div class="r"><label>Seed</label><input type="range" id="se" min="0" max="99" step="1" value="0"><span class="v" id="seV">0</span></div>
  </div>
</div>
<div id="info">Touch drag rotate · Pinch zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- Perlin noise (classic 3D) ----
var _p=new Uint8Array(512);
var _pm=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,
103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,
252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,
68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,
230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,
76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,
186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,
59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,
70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,
178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,
81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,
115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,
78,66,215,61,156,180];
for(var i=0;i<256;i++){_p[i]=_pm[i];_p[256+i]=_pm[i]}

function fade(t){return t*t*t*(t*(t*6-15)+10)}
function lerp(a,b,t){return a+t*(b-a)}
function grad(h,x,y,z){var u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)===0?u:-u)+((h&2)===0?v:-v)}
function perlin3(x,y,z){
  var X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
  x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
  var u=fade(x),v=fade(y),w=fade(z);
  var A=_p[X]+Y,AA=_p[A]+Z,AB=_p[A+1]+Z,B=_p[X+1]+Y,BA=_p[B]+Z,BB=_p[B+1]+Z;
  return lerp(lerp(lerp(grad(_p[AA]&15,x,y,z),grad(_p[BA]&15,x-1,y,z),u),
    lerp(grad(_p[AB]&15,x,y-1,z),grad(_p[BB]&15,x-1,y-1,z),u),v),
    lerp(lerp(grad(_p[AA+1]&15,x,y,z-1),grad(_p[BA+1]&15,x-1,y,z-1),u),
    lerp(grad(_p[AB+1]&15,x,y-1,z-1),grad(_p[BB+1]&15,x-1,y-1,z-1),u),v),w);
}
function fbm(x,y,z,oct){
  var t=0,a=1,f=1;oct=oct||4;
  for(var i=0;i<oct;i++){t+=perlin3(x*f,y*f,z*f)*a;f*=2;a*=0.5}
  return t;
}

// ---- Voronoi F1/F2 ----
function hashVec(ix,iy,iz,s){
  var n=ix*374761393+iy*668265263+iz*1274126177+s*1013904223;
  n=((n^(n>>13))*1274126177)>>>0;var fx=(n&0xFFFF)/65535;
  n=((n*1664525+1013904223)&0x7FFFFFFF)>>>0;var fy=(n&0xFFFF)/65535;
  n=((n*1664525+1013904223)&0x7FFFFFFF)>>>0;var fz=(n&0xFFFF)/65535;
  return[ix+fx,iy+fy,iz+fz];
}
function cellHash(ix,iy,iz,s){
  var n=ix*374761393+iy*668265263+iz*1274126177+s*982451653;
  n=((n^(n>>13))*1274126177)>>>0;return(n&0xFFFF)/65535;
}
function voronoi(px,py,pz,s){
  var ix0=Math.floor(px),iy0=Math.floor(py),iz0=Math.floor(pz);
  var d1=1e10,d2=1e10,bh=0;
  for(var dz=-1;dz<=1;dz++)for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
    var cx=ix0+dx,cy=iy0+dy,cz=iz0+dz;
    var sv=hashVec(cx,cy,cz,s);
    var dd=(px-sv[0])*(px-sv[0])+(py-sv[1])*(py-sv[1])+(pz-sv[2])*(pz-sv[2]);
    if(dd<d1){d2=d1;d1=dd;bh=cellHash(cx,cy,cz,s)}else if(dd<d2){d2=dd}
  }
  return[Math.sqrt(d1),Math.sqrt(d2),bh];
}
function ss(e0,e1,x){var t=Math.max(0,Math.min(1,(x-e0)/(e1-e0+1e-9)));return t*t*(3-2*t)}

// ---- Bark height ----
function bark(ox,oy,p){
  var z=0.5,x=ox,y=oy,wf=0.25;
  x+=fbm(ox*wf,oy*wf,z*wf,3)*p.wx;
  y+=fbm(ox*wf+31.7,oy*wf+31.7,z*wf+31.7,3)*p.wy;
  var ps=p.ps,ys=p.ys,vx=x*ps,vy=y*ps/ys,vz=z*ps;
  var v=voronoi(vx,vy,vz,p.se),f1=v[0],f2=v[1],ch=v[2];
  var bd=f2-f1;
  bd+=fbm(x*ps*4+100,y*ps*4/ys+100,z*ps*4+100,3)*p.ef;
  var wall=ss(0,p.ws,bd);
  var lv=Math.floor(ch*p.nl*0.999);
  var lh=(lv/Math.max(p.nl-1,1))*p.ld;
  var macH=wall*lh;
  var tdx=ch*2-1,tdy=cellHash(Math.floor(vx),Math.floor(vy),Math.floor(vz),p.se+77)*2-1;
  var tiltH=wall*p.pt*(tdx*(ox*ps-Math.floor(vx))+tdy*(oy*ps/ys-Math.floor(vy)));
  var ssc=p.ss,svx=x*ps*ssc,svy=y*ps*ssc/(ys*0.6),svz=z*ps*ssc;
  var sv=voronoi(svx,svy,svz,p.se+42);
  var sb=sv[1]-sv[0];
  sb+=fbm(x*ps*ssc*3+200,y*ps*ssc*3/ys+200,z*ps*ssc*3+200,2)*p.ef*0.5;
  var sw=ss(0,p.ws*1.5,sb);
  var sl=Math.floor(sv[2]*2*0.999);
  var subH=wall*sw*sl*p.sd;
  var hby=oy*p.hf+fbm(ox*0.5+300,oy*0.5+300,z*0.5+300,2)*0.4;
  var hbv=Math.sin(hby*Math.PI*2)*0.5+0.5;
  var hbc=1-ss(0,0.08,hbv);
  var hbH=-wall*hbc*p.hd;
  var ci=0.3+ch*p.pv*0.7;
  var crH=wall*ci*fbm(x*ps*2.5+400,y*ps*1.2+400,z*ps*2.5+400,3)*p.cr;
  var fiH=fbm(x*ps*6+500,y*ps*0.3+500,z*ps*6+500,2)*p.fg;
  var miH=fbm(x*ps*12+600,y*ps*12+600,z*ps*12+600,2)*p.mr;
  return(macH+tiltH+subH+hbH+crH+fiH+miH)*p.od;
}

// ---- Three.js (classic non-module, r128) ----
var canvas=document.getElementById('c');
var W=window.innerWidth,H=window.innerHeight;
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1a1a);
var camera=new THREE.PerspectiveCamera(45,W/H,0.01,100);
camera.position.set(0,0,1.6);

scene.add(new THREE.AmbientLight(0x404040,0.5));
var dl=new THREE.DirectionalLight(0xffeedd,1.8);dl.position.set(2,3,4);scene.add(dl);
var fl=new THREE.DirectionalLight(0x8899bb,0.6);fl.position.set(-2,-1,2);scene.add(fl);

var mat=new THREE.MeshStandardMaterial({color:0x8B6B4A,roughness:0.9,metalness:0});
// Reduced segments for mobile performance
var SX=120,SY=360;
var geo=new THREE.PlaneGeometry(0.4,1.2,SX,SY);
var mesh=new THREE.Mesh(geo,mat);
scene.add(mesh);
var basePos=new Float32Array(geo.attributes.position.array);

// ---- Simple orbit controls (touch + mouse) ----
var rotX=-0.3,rotY=0,dist=1.6,panX=0,panY=0;
var dragging=false,pinching=false,prevX,prevY,prevDist,prevMidX,prevMidY;
var shifted=false;

canvas.addEventListener('mousedown',function(e){dragging=true;prevX=e.clientX;prevY=e.clientY;shifted=e.shiftKey});
window.addEventListener('mousemove',function(e){
  if(!dragging)return;
  var dx=e.clientX-prevX,dy=e.clientY-prevY;prevX=e.clientX;prevY=e.clientY;
  if(shifted||e.shiftKey){panX+=dx*0.002;panY-=dy*0.002}
  else{rotY+=dx*0.008;rotX+=dy*0.008;rotX=Math.max(-1.5,Math.min(1.5,rotX))}
});
window.addEventListener('mouseup',function(){dragging=false});
canvas.addEventListener('wheel',function(e){e.preventDefault();dist*=1+e.deltaY*0.001;dist=Math.max(0.3,Math.min(5,dist))},{passive:false});

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(e.touches.length===1){dragging=true;pinching=false;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY}
  if(e.touches.length===2){
    pinching=true;dragging=false;
    var dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
    prevDist=Math.sqrt(dx*dx+dy*dy);
    prevMidX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    prevMidY=(e.touches[0].clientY+e.touches[1].clientY)/2;
  }
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(dragging&&e.touches.length===1){
    var dx=e.touches[0].clientX-prevX,dy=e.touches[0].clientY-prevY;
    prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
    rotY+=dx*0.008;rotX+=dy*0.008;rotX=Math.max(-1.5,Math.min(1.5,rotX));
  }
  if(pinching&&e.touches.length===2){
    var dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
    var d=Math.sqrt(dx*dx+dy*dy);
    dist*=prevDist/d;dist=Math.max(0.3,Math.min(5,dist));prevDist=d;
    var mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    var my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    panX+=(mx-prevMidX)*0.002;panY-=(my-prevMidY)*0.002;
    prevMidX=mx;prevMidY=my;
  }
},{passive:false});
canvas.addEventListener('touchend',function(e){
  if(e.touches.length<2)pinching=false;
  if(e.touches.length<1)dragging=false;
});

// ---- Params ----
function gp(){return{
  ps:+document.getElementById('ps').value,ys:+document.getElementById('ys').value,
  nl:+document.getElementById('nl').value,ld:+document.getElementById('ld').value,
  ws:+document.getElementById('ws').value,ef:+document.getElementById('ef').value,
  wx:+document.getElementById('wx').value,wy:+document.getElementById('wy').value,
  ss:+document.getElementById('ss').value,sd:+document.getElementById('sd').value,
  hf:+document.getElementById('hf').value,hd:+document.getElementById('hd').value,
  cr:+document.getElementById('cr').value,pv:+document.getElementById('pv').value,
  pt:+document.getElementById('pt').value,fg:+document.getElementById('fg').value,
  mr:+document.getElementById('mr').value,od:+document.getElementById('od').value,
  se:+document.getElementById('se').value
}}

var dirty=true;
document.querySelectorAll('#ui input').forEach(function(inp){
  var vs=document.getElementById(inp.id+'V');
  inp.addEventListener('input',function(){
    var d=inp.step.indexOf('.')>=0?inp.step.split('.')[1].length:0;
    vs.textContent=parseFloat(inp.value).toFixed(d);dirty=true;
  });
});

function updateGeo(){
  var p=gp(),pos=geo.attributes.position.array,cnt=pos.length/3,sc=0.001;
  for(var i=0;i<cnt;i++){
    var bx=basePos[i*3],by=basePos[i*3+1];
    var h=bark(bx*1000*0.005,by*1000*0.005,p);
    pos[i*3+2]=h*sc;
  }
  geo.attributes.position.needsUpdate=true;
  geo.computeVertexNormals();
  document.getElementById('loading').style.display='none';
}

function animate(){
  requestAnimationFrame(animate);
  if(dirty){updateGeo();dirty=false}
  camera.position.set(
    dist*Math.sin(rotY)*Math.cos(rotX)+panX,
    -dist*Math.sin(rotX)+panY,
    dist*Math.cos(rotY)*Math.cos(rotX)
  );
  camera.lookAt(panX,panY,0);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',function(){
  W=window.innerWidth;H=window.innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});
</script>
</body>
</html>
