<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Beach Dive — 180 SBS — MockTube VR</title>
</head>
<body style="font-family:system-ui;background:#111;color:#eee">
  <h1>MockTube VR — a pretend VR video site</h1>
  <p>(stands in for a real site so the userscript can be tested offline)</p>
  <video id="v" playsinline muted style="width:480px;height:240px;background:#000"></video>
  <script>
    // A same-origin video via canvas.captureStream: LEFT half red, RIGHT half
    // blue — so SBS per-eye routing is verifiable (left eye red, right eye blue).
    const cv = document.createElement('canvas'); cv.width = 1280; cv.height = 640;
    const cx = cv.getContext('2d'); let f = 0;
    (function draw() {
      cx.fillStyle = '#c0392b'; cx.fillRect(0, 0, 640, 640);          // left half (left eye)
      cx.fillStyle = '#2c5fc0'; cx.fillRect(640, 0, 640, 640);        // right half (right eye)
      cx.fillStyle = '#fff'; cx.font = '48px sans-serif';
      cx.fillText('L', 300, 330); cx.fillText('R', 940, 330);
      f++; requestAnimationFrame(draw);
    })();
    const v = document.getElementById('v');
    v.srcObject = cv.captureStream(15);
    v.play();
  </script>
</body>
</html>
